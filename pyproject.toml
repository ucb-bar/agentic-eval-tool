[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aet"
version = "0.1.0"
description = "Agentic Eval Tool — reusable research evaluation harness for compiler, runtime, and agentic code-generation experiments"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
tracking = [
    "mlflow>=2.20",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "jsonschema>=4.0",
]
openllmetry = [
    "opentelemetry-instrumentation-anthropic>=0.55",
    "opentelemetry-instrumentation-openai>=0.55",
]
ray    = ["ray[default]>=2.40"]
viz    = ["matplotlib>=3.7", "numpy>=1.24"]
docs   = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev    = ["pytest>=8.0", "ruff", "jsonschema>=4.0"]
# `all` composes the other extras (single source of truth — no hand-duplicated pins).
all    = ["aet[tracking,openllmetry,ray,viz,docs,dev]"]

[project.scripts]
aet = "aet.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aet" = [
    "templates/**/*",
    "templates/**/.gitkeep",
    "suites/targetgen/schemas/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set: pyflakes (F) + pycodestyle E4 (imports) / E7 (statements) / E9 (syntax).
# Line length (E501) is intentionally left to a formatter — the bar here is "clean, not pedantic".
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests idiomatically use short loop vars (`l`) and manipulate sys.path before importing local
# example modules — both are fine in test code, not shipped library code.
"tests/**" = ["E741", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
