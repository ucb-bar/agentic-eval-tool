[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aet"
version = "0.1.0"
description = "Agentic Eval Tool — reusable research evaluation harness for compiler, runtime, and agentic code-generation experiments"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
tracking = [
    "mlflow>=2.20",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "jsonschema>=4.0",
]
ray    = ["ray[default]>=2.40"]
dev    = ["pytest>=8.0", "ruff", "jsonschema>=4.0"]
all    = [
    "mlflow>=2.20",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "jsonschema>=4.0",
    "ray[default]>=2.40",
    "pytest>=8.0",
    "ruff",
]

[project.scripts]
aet = "aet.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aet" = [
    "templates/**/*",
    "templates/**/.gitkeep",
    "suites/targetgen/schemas/*.json",
]
