name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (viz + docs + dev)
        run: pip install -e ".[viz,docs,dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Test
        run: pytest
      - name: Docs build (strict — fails on any broken/renamed reference)
        run: mkdocs build --strict
