# OpenTelemetry Collector — fan-out to Jaeger (traces) + Prometheus (metrics).
# Used by docker-compose.observability.yml.
#
# Standalone Jaeger (no collector needed):
#   docker compose -f docker-compose.jaeger.yml up -d
#
# Full stack with metrics:
#   docker compose -f docker-compose.observability.yml up -d

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: aet

  # --- SigNoz fan-out (only relevant if running this collector alongside SigNoz) ---
  # Uncomment and add to exporters lists below if you want a single collector
  # that fans out to both Jaeger AND SigNoz simultaneously.
  # When using SigNoz exclusively, skip this file and point aet at port 4318 directly.
  # otlp/signoz:
  #   endpoint: http://localhost:4317   # SigNoz OTel collector port
  #   tls:
  #     insecure: true

  # --- Logfire (cloud) ---
  # otlp/logfire:
  #   endpoint: https://logfire-api.pydantic.dev
  #   headers:
  #     Authorization: "Bearer ${LOGFIRE_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
